[package]
name = "scopehop"
version = "0.1.0"
edition = "2024"
description = "Scope-aware go-to-definition and find-references built on tree-sitter"

[dependencies]
anyhow = "1.0.104"
ignore = "0.4.34"
lsp-server = "0.10.0"
lsp-types = "0.97"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25.0"
